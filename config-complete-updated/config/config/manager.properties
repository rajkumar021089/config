# Active environment; changes take effect only on startup or Reset Server Cache.
environment=dev
# Optional logical package supplying global fallback keys; blank disables fallback.
globalPackage=
# Explicit security/performance choice. false keeps ciphertext cached and decrypts on retrieval.
cacheDecryptedSecrets=false

# Discovery settings (case-sensitive folder names on Linux)
packagePrefix=NBK
configurationDirectories=Config,config
commonConfigFiles=wxConfig.cnf,config.cnf
